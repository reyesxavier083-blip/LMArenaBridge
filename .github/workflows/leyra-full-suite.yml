name: LEYRA Full Suite and Skillet Connection

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leyra-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test-suite:
    name: Full pytest suite (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile all Python modules
        run: python -m compileall -q src tests
      - name: Run the complete test suite with coverage
        run: |
          python -m pytest tests -ra --strict-markers --cov=src --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leyra-coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  skillet-live-connection:
    name: Skillet real MCP connection (secret-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LEYRA_SKILLET_MCP_URL: ${{ secrets.LEYRA_SKILLET_MCP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal connection dependencies
        if: ${{ env.LEYRA_SKILLET_MCP_URL != '' }}
        run: python -m pip install httpx
      - name: Verify real Skillet MCP handshake and read-only listing
        if: ${{ env.LEYRA_SKILLET_MCP_URL != '' }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          from src.leyra_skillet import call_skillet_tool

          async def main():
              result = await call_skillet_tool("list_skills")
              if not isinstance(result, dict):
                  raise SystemExit("MCP returned an unexpected result type")
              content = result.get("content", [])
              if not isinstance(content, list):
                  raise SystemExit("MCP list_skills returned no content list")
              print(json.dumps({
                  "connection": "verified",
                  "tool": "list_skills",
                  "content_items": len(content),
              }))

          asyncio.run(main())
          PY
      - name: Explain skipped live check
        if: ${{ env.LEYRA_SKILLET_MCP_URL == '' }}
        run: echo "SKIPPED - Configure the repository Actions secret LEYRA_SKILLET_MCP_URL to enable the real hosted MCP check."
